services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      APP_STORAGE_DIR: /data
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      DATABASE_URL: postgresql://${POSTGRES_USER:-genealogy}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-genealogy}?schema=public
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    volumes:
      - genealogy-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/mcp >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-genealogy}
      POSTGRES_USER: ${POSTGRES_USER:-genealogy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-genealogy} -d ${POSTGRES_DB:-genealogy}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  genealogy-data:
  postgres-data: